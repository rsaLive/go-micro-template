apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiee-multicast-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fiee-multicast-server
  template:
    metadata:
      labels:
        app: fiee-multicast-server
    spec:
      containers:
        - name: fiee-multicast-server
          image: xxxx/k8stest/fiee-multicast-server:latest
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "50m"
          ports:
            - containerPort: 20126
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: runtime
              mountPath: /app/runtime
            - name: cert-volume
              mountPath: /etc/cert
          envFrom:
            - configMapRef:
                name: "erp-configmap"
            - secretRef:
                name: erp-secret
          readinessProbe:
            tcpSocket:
              port: 20126
            initialDelaySeconds: 10
            periodSeconds: 10
#      nodeSelector:
#        node: node1
      imagePullSecrets:
        - name: docker-login-secret
      volumes:
        - name: cert-volume
          secret:
            secretName: my-ssl-secret
        - name: logs
          nfs:
            server: node0
            path: /mnt/storage/erp/fiee-multicast-server/logs
        - name: runtime
          nfs:
            server: node0
            path: /mnt/storage/erp/fiee-multicast-server/runtime
---

apiVersion: v1
kind: Service
metadata:
  name: fiee-multicast-server
spec:
  type: NodePort
  selector:
    app: fiee-multicast-server
  ports:
    - name: http
      protocol: TCP
      nodePort: 20126
      targetPort: 20126
      port: 20126